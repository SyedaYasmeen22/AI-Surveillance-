<svg viewBox="0 0 860 420" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono', monospace">
  <defs>
    <marker id="ax" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#4a4845"/>
    </marker>
    <marker id="red" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#c4390a"/>
    </marker>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c4390a" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#c4390a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="860" height="420" fill="#faf9f7"/>
  <text x="430" y="28" text-anchor="middle" font-size="11" fill="#c4390a" letter-spacing="2">LATTICE GEOMETRY &amp; LWE NOISE VISUALIZATION</text>
  <line x1="60" y1="38" x2="800" y2="38" stroke="#e2ddd8"/>

  <!-- ═══════ LEFT PANEL: 2D LATTICE ═══════ -->
  <text x="200" y="58" text-anchor="middle" font-size="9" fill="#8a8780" letter-spacing="1">LATTICE Λ ⊂ ℤ²  (2D ILLUSTRATION)</text>

  <!-- Grid lines (lattice) -->
  <g stroke="#e2ddd8" stroke-width="0.75">
    <!-- vertical -->
    <line x1="80" y1="70" x2="80" y2="360"/>
    <line x1="116" y1="70" x2="116" y2="360"/>
    <line x1="152" y1="70" x2="152" y2="360"/>
    <line x1="188" y1="70" x2="188" y2="360"/>
    <line x1="224" y1="70" x2="224" y2="360"/>
    <line x1="260" y1="70" x2="260" y2="360"/>
    <line x1="296" y1="70" x2="296" y2="360"/>
    <line x1="332" y1="70" x2="332" y2="360"/>
    <!-- horizontal -->
    <line x1="68" y1="82" x2="344" y2="82"/>
    <line x1="68" y1="118" x2="344" y2="118"/>
    <line x1="68" y1="154" x2="344" y2="154"/>
    <line x1="68" y1="190" x2="344" y2="190"/>
    <line x1="68" y1="226" x2="344" y2="226"/>
    <line x1="68" y1="262" x2="344" y2="262"/>
    <line x1="68" y1="298" x2="344" y2="298"/>
    <line x1="68" y1="334" x2="344" y2="334"/>
  </g>

  <!-- Lattice points (black) -->
  <g fill="#1a1917">
    <circle cx="80" cy="82" r="3"/><circle cx="116" cy="82" r="3"/><circle cx="152" cy="82" r="3"/>
    <circle cx="188" cy="82" r="3"/><circle cx="224" cy="82" r="3"/><circle cx="260" cy="82" r="3"/>
    <circle cx="296" cy="82" r="3"/><circle cx="332" cy="82" r="3"/>
    <circle cx="80" cy="118" r="3"/><circle cx="116" cy="118" r="3"/><circle cx="152" cy="118" r="3"/>
    <circle cx="188" cy="118" r="3"/><circle cx="224" cy="118" r="3"/><circle cx="260" cy="118" r="3"/>
    <circle cx="296" cy="118" r="3"/><circle cx="332" cy="118" r="3"/>
    <circle cx="80" cy="154" r="3"/><circle cx="116" cy="154" r="3"/><circle cx="152" cy="154" r="3"/>
    <circle cx="188" cy="154" r="3"/><circle cx="224" cy="154" r="3"/><circle cx="260" cy="154" r="3"/>
    <circle cx="296" cy="154" r="3"/><circle cx="332" cy="154" r="3"/>
    <circle cx="80" cy="190" r="3"/><circle cx="116" cy="190" r="3"/><circle cx="152" cy="190" r="3"/>
    <circle cx="188" cy="190" r="3"/><circle cx="224" cy="190" r="3"/><circle cx="260" cy="190" r="3"/>
    <circle cx="296" cy="190" r="3"/><circle cx="332" cy="190" r="3"/>
    <circle cx="80" cy="226" r="3"/><circle cx="116" cy="226" r="3"/><circle cx="152" cy="226" r="3"/>
    <circle cx="188" cy="226" r="3"/><circle cx="224" cy="226" r="3"/><circle cx="260" cy="226" r="3"/>
    <circle cx="296" cy="226" r="3"/><circle cx="332" cy="226" r="3"/>
    <circle cx="80" cy="262" r="3"/><circle cx="116" cy="262" r="3"/><circle cx="152" cy="262" r="3"/>
    <circle cx="188" cy="262" r="3"/><circle cx="224" cy="262" r="3"/><circle cx="260" cy="262" r="3"/>
    <circle cx="296" cy="262" r="3"/><circle cx="332" cy="262" r="3"/>
    <circle cx="80" cy="298" r="3"/><circle cx="116" cy="298" r="3"/><circle cx="152" cy="298" r="3"/>
    <circle cx="188" cy="298" r="3"/><circle cx="224" cy="298" r="3"/><circle cx="260" cy="298" r="3"/>
    <circle cx="296" cy="298" r="3"/><circle cx="332" cy="298" r="3"/>
    <circle cx="80" cy="334" r="3"/><circle cx="116" cy="334" r="3"/><circle cx="152" cy="334" r="3"/>
    <circle cx="188" cy="334" r="3"/><circle cx="224" cy="334" r="3"/><circle cx="260" cy="334" r="3"/>
    <circle cx="296" cy="334" r="3"/><circle cx="332" cy="334" r="3"/>
  </g>

  <!-- Gaussian noise blob around a lattice point (226,190) → "As" -->
  <ellipse cx="226" cy="190" rx="28" ry="28" fill="url(#glow)"/>
  <ellipse cx="226" cy="190" rx="14" ry="14" fill="#c4390a" fill-opacity="0.08"/>
  
  <!-- True lattice point (s ← secret) -->
  <circle cx="224" cy="190" r="5" fill="#1a1917"/>
  <text x="238" y="183" font-size="8" fill="#1a1917">As (lattice point)</text>

  <!-- Noisy sample b = As + e -->
  <circle cx="233" cy="197" r="5" fill="#c4390a"/>
  <line x1="224" y1="190" x2="233" y2="197" stroke="#c4390a" stroke-width="1.5" stroke-dasharray="3,2" marker-end="url(#red)"/>
  <text x="242" y="201" font-size="8" fill="#c4390a">b = As+e (LWE sample)</text>
  <text x="242" y="213" font-size="8" fill="#c4390a">error e ← N(0, σ²)</text>

  <!-- Noise radius circle -->
  <circle cx="224" cy="190" r="22" fill="none" stroke="#c4390a" stroke-width="0.75" stroke-dasharray="4,3" opacity="0.5"/>
  <text x="248" y="168" font-size="7" fill="#8a8780">‖e‖ ≤ σ√n</text>

  <!-- CVP hardness annotation -->
  <text x="206" y="290" text-anchor="middle" font-size="8" fill="#4a4845">Closest Vector Problem:</text>
  <text x="206" y="304" text-anchor="middle" font-size="8" fill="#4a4845">Given b, find nearest</text>
  <text x="206" y="316" text-anchor="middle" font-size="8" fill="#4a4845">lattice point — NP-hard</text>
  <rect x="120" y="282" width="172" height="40" rx="3" fill="none" stroke="#e2ddd8" stroke-dasharray="4,3"/>

  <!-- ═══════ RIGHT PANEL: Gaussian Error Distribution ═══════ -->
  <text x="600" y="58" text-anchor="middle" font-size="9" fill="#8a8780" letter-spacing="1">DISCRETE GAUSSIAN ERROR  χ = D(σ=3.19)</text>

  <!-- Axes -->
  <line x1="390" y1="330" x2="810" y2="330" stroke="#4a4845" stroke-width="1.2" marker-end="url(#ax)"/>
  <line x1="600" y1="350" x2="600" y2="72" stroke="#4a4845" stroke-width="1.2" marker-end="url(#ax)"/>
  <text x="815" y="334" font-size="9" fill="#4a4845">e</text>
  <text x="598" y="66" font-size="9" fill="#4a4845">P(e)</text>

  <!-- x-axis labels -->
  <g font-size="8" fill="#8a8780" text-anchor="middle">
    <text x="432" y="344">−10</text>
    <text x="474" y="344">−8</text>
    <text x="516" y="344">−6</text>
    <text x="558" y="344">−4</text>
    <text x="579" y="344">−2</text>
    <text x="600" y="344">0</text>
    <text x="621" y="344">2</text>
    <text x="642" y="344">4</text>
    <text x="684" y="344">6</text>
    <text x="726" y="344">8</text>
    <text x="768" y="344">10</text>
  </g>

  <!-- Gaussian bars (discrete, σ=3.19) -->
  <!-- bar heights computed: P(k) ∝ exp(-k²/2σ²), max at k=0 -->
  <!-- scaled so P(0) bar height = 220px -->
  <!-- σ=3.19, σ²=10.18 -->
  <g fill="#c4390a" opacity="0.85">
    <!-- k=0 -->
    <rect x="591" y="110" width="18" height="220" rx="1"/>
    <!-- k=±1 -->
    <rect x="612" y="121" width="18" height="209" rx="1"/>
    <rect x="570" y="121" width="18" height="209" rx="1"/>
    <!-- k=±2 -->
    <rect x="633" y="152" width="18" height="178" rx="1"/>
    <rect x="549" y="152" width="18" height="178" rx="1"/>
    <!-- k=±3 -->
    <rect x="654" y="197" width="18" height="133" rx="1"/>
    <rect x="528" y="197" width="18" height="133" rx="1"/>
    <!-- k=±4 -->
    <rect x="675" y="241" width="18" height="89" rx="1"/>
    <rect x="507" y="241" width="18" height="89" rx="1"/>
    <!-- k=±5 -->
    <rect x="696" y="275" width="18" height="55" rx="1"/>
    <rect x="486" y="275" width="18" height="55" rx="1"/>
    <!-- k=±6 -->
    <rect x="717" y="298" width="18" height="32" rx="1"/>
    <rect x="465" y="298" width="18" height="32" rx="1"/>
    <!-- k=±7 -->
    <rect x="738" y="313" width="18" height="17" rx="1"/>
    <rect x="444" y="313" width="18" height="17" rx="1"/>
    <!-- k=±8 -->
    <rect x="759" y="321" width="18" height="9" rx="1"/>
    <rect x="423" y="321" width="18" height="9" rx="1"/>
    <!-- k=±9 -->
    <rect x="780" y="325" width="18" height="5" rx="1"/>
    <rect x="402" y="325" width="18" height="5" rx="1"/>
  </g>

  <!-- Gaussian envelope curve -->
  <path d="M400,329 Q420,325 440,320 Q460,309 480,288 Q510,252 540,199 Q560,163 580,128 Q591,111 600,110 Q609,111 620,128 Q640,163 660,199 Q690,252 720,288 Q740,309 760,320 Q780,325 800,329"
    fill="none" stroke="#1a1917" stroke-width="1.5" stroke-dasharray="6,3"/>

  <!-- σ annotation -->
  <line x1="600" y1="220" x2="621" y2="220" stroke="#4a4845" stroke-width="1"/>
  <line x1="621" y1="215" x2="621" y2="225" stroke="#4a4845" stroke-width="1"/>
  <text x="625" y="218" font-size="8" fill="#4a4845">σ = 3.19</text>

  <!-- ±q/4 danger zone annotation -->
  <text x="600" y="372" text-anchor="middle" font-size="8" fill="#4a4845">Decryption correct iff |eᵀr| &lt; q/4 = 1920</text>
  <text x="600" y="385" text-anchor="middle" font-size="8" fill="#8a8780">Tail probability negligible for above parameters</text>

  <!-- Section divider -->
  <line x1="375" y1="50" x2="375" y2="395" stroke="#e2ddd8" stroke-width="1"/>

  <!-- Caption -->
  <text x="430" y="408" text-anchor="middle" font-size="9" fill="#8a8780">Fig. 3 — Left: 2D lattice with LWE sample b=As+e (CVP hardness). Right: Discrete Gaussian error distribution χ with σ=3.19.</text>
</svg>
